display_information:
  name: patch-bot
  description: Fixes bugs from Slack and opens pull requests
features:
  bot_user:
    display_name: patchbot
    always_online: true
oauth_config:
  scopes:
    bot:
      - app_mentions:read
      - chat:write
      - channels:history
settings:
  event_subscriptions:
    bot_events:
      - app_mention
  socket_mode_enabled: true
  interactivity:
    is_enabled: false